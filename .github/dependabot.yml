version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      # cf と wrangler は版の種類を限らず同じPRにする。development より前で先に一致させる。
      cloudflare-toolchain:
        applies-to: version-updates
        patterns:
          - "cf"
          - "wrangler"
      # Bunはdependency-typeの公式対応外のため、devDependencies追加時はこの一覧も更新する。
      development:
        applies-to: version-updates
        patterns:
          - "@types/bun"
          - "cf"
          - "typescript"
          - "wrangler"
        update-types: ["minor", "patch"]
      production:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
